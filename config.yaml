baseURL: "https://markito.io"
languageCode: "en-us"
title: "William Markito"
theme: PaperMod
pagination:
  pagerSize: 10

relativeURLs: true
minify:
  disableXML: true
  minifyOutput: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleanalytics: UA-132475739-1

enableEmoji: true

# Main sections for homepage (posts)
params:
  env: production
  author: William Markito
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  disableSpecial1stPost: true

  favicon: "/images/fav.png"
  description: "Product leader, engineer, and writer exploring technology, leadership, and building great products."

  # Homepage info section
  homeInfoParams:
    Title: "William Markito"
    Content: |
      Product leader with experience building platforms and teams at scale.
      Writing about technology, leadership, and the craft of building great products.

  socialIcons:
    - name: twitter
      url: "https://twitter.com/markito"
    - name: github
      url: "https://github.com/markito"
    - name: linkedin
      url: "https://linkedin.com/in/markito"

  # Cover image settings
  cover:
    hidden: false
    hiddenInList: true
    hiddenInSingle: false

  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# Main navigation menu
menu:
  main:
    - identifier: blog
      name: Blog
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: talks
      name: Talks
      url: /talks/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Taxonomies
taxonomies:
  tag: tags
  category: categories

# Main sections for homepage listing
mainSections:
  - posts
