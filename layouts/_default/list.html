{{ define "main" }}
<section class="hero">
  <div class="prompt"><span class="user">markito</span>@io <span class="path">:~$</span> ls ./writing</div>
  <h1 class="name" style="font-size:52px;">{{ .Title }}</h1>
</section>
<section class="sec">
  <div class="posts">
    {{ range .Pages }}
      <a class="post-link" href="{{ .RelPermalink }}">
        <div class="post-head">
          <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
          <span class="post-title">{{ .Title }}</span>
        </div>
        {{ with .Summary }}<div class="post-sum">{{ . | plainify | truncate 160 }}</div>{{ end }}
        {{ with .Params.tags }}<div class="post-tags">{{ delimit . " · " }}</div>{{ end }}
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
